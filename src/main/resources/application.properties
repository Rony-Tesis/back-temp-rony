spring.application.name=back-rony
spring.config.import=optional:file:./application-local.properties
server.address=127.0.0.1
server.port=${RONY_PORT:8000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.async.request-timeout=0
spring.threads.virtual.enabled=true

# Workbench administers this MySQL schema. Secrets belong to environment/local ignored config.
spring.datasource.url=jdbc:mysql://${RONY_DB_HOST:127.0.0.1}:${RONY_DB_PORT:3306}/${RONY_DB_NAME:rony_local}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${RONY_DB_USER:root}
spring.datasource.password=${RONY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.jackson.deserialization.fail-on-unknown-properties=true

springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.paths-to-match=/api/v1/**,/

rony.source-mode=${RONY_MODE:live}
rony.physical-motion=${RONY_ENABLE_ROBOT_MOTION:true}
rony.workers-enabled=${RONY_WORKERS_ENABLED:true}
rony.frames-per-second=10
rony.access-token=${RONY_ACCESS_TOKEN:}
rony.allowed-hosts=${RONY_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}
rony.maximum-streams=8
rony.python-executable=${RONY_PYTHON:../rony-yolo-isaac/.venv/Scripts/python.exe}
rony.worker-script=./adapters/worker.py
rony.camera-url=${RONY_CAMERA_URL:http://${RONY_HOST:192.168.149.1}:8080/stream?topic=/usb_cam/image_rect_color}
rony.model-path=${RONY_MODEL_PATH:../rony-yolo-isaac/modelo/yolo11n_300ep_20261028_211758_best.pt}
rony.runtime-profile=${RONY_RUNTIME_PROFILE:../rony-yolo-isaac/runtime/rony_profile.json}
rony.robot-agent-url=${RONY_ROBOT_AGENT_URL:http://${RONY_HOST:192.168.149.1}:8090}
rony.robot-agent-token=${RONY_ROBOT_AGENT_TOKEN:}
rony.execution-location=${RONY_EXECUTION_LOCATION:pc}
rony.device-id=${RONY_DEVICE_ID:jetmax-01}
rony.device-token=${RONY_DEVICE_TOKEN:}
