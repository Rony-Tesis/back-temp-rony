server.forward-headers-strategy=framework
spring.datasource.url=jdbc:mysql://${RONY_DB_HOST:db}:${RONY_DB_PORT:3306}/${RONY_DB_NAME:rony}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${RONY_DB_USER:rony}
spring.datasource.password=${RONY_DB_PASSWORD}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
rony.source-mode=live
rony.physical-motion=false
rony.workers-enabled=true
rony.execution-location=cloud
