server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework

# Aiven certificate and hostname must both be verified. No unencrypted fallback.
spring.datasource.url=jdbc:mysql://${RONY_DB_HOST}:${RONY_DB_PORT}/${RONY_DB_NAME}?sslMode=VERIFY_IDENTITY&fallbackToSystemTrustStore=false&trustCertificateKeyStoreUrl=${RONY_DB_TRUSTSTORE_URL:file:/tmp/rony-aiven-truststore.p12}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&connectionTimeZone=UTC&connectTimeout=30000&socketTimeout=30000
spring.datasource.username=${RONY_DB_USER}
spring.datasource.password=${RONY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# Hikari also derives the JDBC login timeout from this setting. The 5 s bench
# default can expire during a cold TLS handshake on Render's low-CPU instance.
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.initialization-fail-timeout=60000
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

rony.source-mode=live
rony.physical-motion=false
rony.workers-enabled=true
rony.execution-location=cloud
rony.web-portal=false
# Netlify proxies have bounded request lifetimes. Use finite JSON/JPEG requests.
rony.browser-streaming-enabled=false
rony.runtime-profile=${RONY_RUNTIME_PROFILE:/opt/rony/rony_profile.json}
rony.frontend-url=${RONY_FRONTEND_URL:https://rony-brazo.netlify.app}
rony.allowed-hosts=${RONY_ALLOWED_HOSTS:localhost,127.0.0.1,${RENDER_EXTERNAL_HOSTNAME:localhost},rony-brazo.netlify.app}
